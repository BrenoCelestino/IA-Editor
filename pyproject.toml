[project]
name = "ia-editor"
version = "0.1.0"
description = "Ambiente local isolado para edição de vídeo com IA (yt-dlp, openai-whisper, hyperframes)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
    "openai-whisper>=20250625",
    "torch>=2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
